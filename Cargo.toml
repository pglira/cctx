[package]
name = "cctx"
version = "0.1.0"
edition = "2021"
description = "TUI to inspect and prune the Claude Code context of a directory"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
similar = "2"
trash = "5"
walkdir = "2"

[profile.release]
strip = true
lto = true
